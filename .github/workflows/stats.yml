name: stats

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README numbers against the working tree
        run: python3 scripts/stats.py --check
